name: Build

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  GRASSIBOARD_VERSION: 0.7.0
  DOTNET_SDK_VERSION: 8.0.423

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Generate build information
        shell: pwsh
        run: |
          ./tools/New-BuildInfo.ps1 `
            -Version $env:GRASSIBOARD_VERSION `
            -CommitSha $env:GITHUB_SHA `
            -RunNumber $env:GITHUB_RUN_NUMBER `
            -OutputPath ./src/GrassiBoard.App/BuildInfo.json `
            -Configuration Release `
            -TargetArchitecture x64 `
            -WdkVersion external-cable `
            -SdkVersion windows-runner `
            -DotNetVersion $env:DOTNET_SDK_VERSION

      - name: Configure native engine
        run: cmake --preset windows-x64-release

      - name: Build native engine and tests
        run: cmake --build --preset windows-x64-release -- /m

      - name: Run native tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./artifacts/test-results -Force | Out-Null
          ctest --preset windows-x64-release --output-junit "$env:GITHUB_WORKSPACE/artifacts/test-results/native-tests.xml"
          Copy-Item `
            ./out/build/windows-x64-release/pitch-test-output `
            ./artifacts/test-results/pitch-samples `
            -Recurse `
            -Force

      - name: Run managed smoke tests
        shell: pwsh
        run: |
          dotnet run `
            --project ./tests/GrassiBoard.App.SmokeTests/GrassiBoard.App.SmokeTests.csproj `
            --configuration Release
          @{
            Name = 'Managed BuildInfo smoke test'
            Outcome = 'Passed'
          } | ConvertTo-Json | Set-Content ./artifacts/test-results/managed-tests.json -Encoding utf8

      - name: Publish self-contained WPF app
        shell: pwsh
        run: |
          dotnet publish ./src/GrassiBoard.App/GrassiBoard.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output ./artifacts/publish `
            -p:Platform=x64 `
            -p:SourceRevisionId=$env:GITHUB_SHA

      - name: Stage native outputs
        shell: pwsh
        run: |
          $nativeSource = './out/build/windows-x64-release/src/GrassiBoard.AudioEngine/Release'
          New-Item -ItemType Directory -Path ./artifacts/native -Force | Out-Null
          Copy-Item "$nativeSource/GrassiBoard.AudioEngine.dll" ./artifacts/native -Force
          Get-ChildItem $nativeSource -Filter '*.pdb' -ErrorAction SilentlyContinue |
            Copy-Item -Destination ./artifacts/native -Force

      - name: Package artifacts
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          ./tools/Package-Milestone.ps1 `
            -Version $env:GRASSIBOARD_VERSION `
            -ShortSha $shortSha `
            -PublishDirectory ./artifacts/publish `
            -NativeDirectory ./artifacts/native `
            -TestResultsDirectory ./artifacts/test-results

      - name: Verify portable package contract
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $archivePath = "./artifacts/packages/GrassiBoard-portable-win-x64-$env:GRASSIBOARD_VERSION-$shortSha.zip"
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archivePath))
          try {
            $names = $archive.Entries.FullName | ForEach-Object { $_ -replace '\\', '/' }
            $required = @(
              'GrassiBoard.exe',
              'GrassiBoard.AudioEngine.dll',
              'BuildInfo.json',
              'CHANGELOG.md',
              'README-FIRST.txt',
              'EXTERNAL-CABLE-SETUP.md',
              'THIRD-PARTY-NOTICES.txt'
            )
            foreach ($item in $required) {
              if ($item -notin $names) {
                throw "Portable package is missing $item"
              }
            }
            if ($names | Where-Object { $_ -match '\.(sys|inf|cat|cer|pfx)$' }) {
              throw 'The portable app package must not contain driver or certificate material.'
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload portable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GrassiBoard-portable-win-x64-${{ env.GRASSIBOARD_VERSION }}-${{ github.run_number }}
          path: artifacts/packages/GrassiBoard-portable-win-x64-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload symbols package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GrassiBoard-symbols-${{ env.GRASSIBOARD_VERSION }}-${{ github.run_number }}
          path: artifacts/packages/GrassiBoard-symbols-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload test-results package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GrassiBoard-test-results-${{ env.GRASSIBOARD_VERSION }}-${{ github.run_number }}
          path: artifacts/packages/GrassiBoard-test-results-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
