name: Prerelease

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  prerelease:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Download build packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: GrassiBoard-*
          path: artifacts/release
          merge-multiple: true

      - name: Create unconfirmed prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archives = Get-ChildItem ./artifacts/release -Filter '*.zip' -File
          if ($archives.Count -ne 3) {
            throw "Expected three release ZIPs, found $($archives.Count)."
          }
          gh release create $env:GITHUB_REF_NAME $archives.FullName `
            --repo $env:GITHUB_REPOSITORY `
            --title "GrassiBoard $env:GITHUB_REF_NAME" `
            --prerelease `
            --generate-notes
