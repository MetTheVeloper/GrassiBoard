name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Download build packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: GrassiBoard-*
          path: artifacts/release
          merge-multiple: true

      - name: Create stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archives = Get-ChildItem ./artifacts/release -Filter '*.zip' -File
          $installers = Get-ChildItem ./artifacts/release -Filter 'GrassiBoard-Setup-*.exe' -File
          if ($archives.Count -ne 3) {
            throw "Expected three release ZIPs, found $($archives.Count)."
          }
          if ($installers.Count -ne 1) {
            throw "Expected one setup executable, found $($installers.Count)."
          }
          $assets = @($archives) + @($installers)
          gh release create $env:GITHUB_REF_NAME $assets.FullName `
            --repo $env:GITHUB_REPOSITORY `
            --title "GrassiBoard $env:GITHUB_REF_NAME" `
            --generate-notes
