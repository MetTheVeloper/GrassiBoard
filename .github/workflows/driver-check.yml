name: Driver Artifact

on:
  push:
    branches:
      - main
    paths:
      - src/GrassiBoard.Driver/**
      - src/GrassiBoard.DeviceTool/**
      - tools/Test-DriverPackageSource.ps1
      - tools/New-TestSignedDriverPackage.ps1
      - packages.config
      - Directory.Build.props
      - .github/workflows/driver-check.yml
  pull_request:
    paths:
      - src/GrassiBoard.Driver/**
      - src/GrassiBoard.DeviceTool/**
      - tools/Test-DriverPackageSource.ps1
      - tools/New-TestSignedDriverPackage.ps1
      - packages.config
      - Directory.Build.props
      - .github/workflows/driver-check.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  GRASSIBOARD_VERSION: 0.5.0
  WDK_NUGET_VERSION: 10.0.26100.6584

jobs:
  build-driver:
    name: Windows x64 test-signed driver
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Install NuGet CLI
        uses: NuGet/setup-nuget@17d6beb0142f0371858976c178033f915525e692 # v2.0.1

      - name: Restore pinned Windows driver kits
        run: nuget restore ./packages.config -PackagesDirectory ./packages -NonInteractive

      - name: Validate source contract
        shell: pwsh
        run: ./tools/Test-DriverPackageSource.ps1

      - name: Build driver and root-device helper
        shell: pwsh
        run: |
          $solutionDirectory = "$env:GITHUB_WORKSPACE\"
          msbuild ./src/GrassiBoard.DeviceTool/GrassiBoard.DeviceTool.vcxproj /m /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$solutionDirectory"
          msbuild ./src/GrassiBoard.Driver/GrassiBoard.Driver.vcxproj /m /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$solutionDirectory"

      - name: Sign and verify package with ephemeral certificate
        shell: pwsh
        run: |
          ./tools/New-TestSignedDriverPackage.ps1 `
            -BuildDirectory ./artifacts/driver-build `
            -DeviceToolDirectory ./artifacts/driver-tools `
            -OutputDirectory ./artifacts/driver `
            -WdkPackageDirectory "./packages/Microsoft.Windows.WDK.x64.$env:WDK_NUGET_VERSION" `
            -Version $env:GRASSIBOARD_VERSION
          if (Get-ChildItem ./artifacts/driver -Recurse -File | Where-Object { $_.Extension -in '.pfx', '.pvk', '.key' }) {
            throw 'Private signing key material is present in the artifact.'
          }

      - name: Upload driver artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GrassiBoard-driver-x64-${{ env.GRASSIBOARD_VERSION }}-${{ github.run_number }}
          path: artifacts/driver/**
          if-no-files-found: error
          retention-days: 30
